[project]
name = "blender-mcp"
version = "2.0.0"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11.0, <3.12"
license = "MIT"
dependencies = ["mcp[cli]>=1.25.0"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[project.optional-dependencies]
addon = []

[dependency-groups]
dev = [
  "bpy>=5.0.1",
  "ruff>=0.14.10",
  "ty>=0.0.5",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"
